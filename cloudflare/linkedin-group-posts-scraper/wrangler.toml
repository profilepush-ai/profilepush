name = "profilepush-linkedin-group-posts-scraper"
main = "src/index.ts"
compatibility_date = "2026-08-08"
workers_dev = true

[vars]
SUPABASE_URL = "https://nhwqcqzvotgdngtxulwi.supabase.co"
PROCESSOR_WORKER_URL = "https://profilepush-linkedin-group-posts-processor.profilepush-ai.workers.dev"

[[services]]
binding = "PROCESSOR_WORKER"
service = "profilepush-linkedin-group-posts-processor"

[triggers]
# 17:00-01:00 Asia/Kolkata (UTC+05:30), hourly and inclusive.
crons = ["30 11-19 * * *"]

[[queues.producers]]
binding = "GROUP_SCRAPE_QUEUE"
queue = "linkedin-group-post-scrape"

[[queues.consumers]]
queue = "linkedin-group-post-scrape"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "linkedin-group-post-scrape-dlq"
