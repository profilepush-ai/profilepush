name = "profilepush-website-host"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
# Sites are served by hostname: <slug>.<SITES_DOMAIN> for demos and live
# sites, and customers' own domains (Cloudflare for SaaS custom hostnames,
# with this Worker as the fallback origin). Until SITES_DOMAIN is routed,
# sites are reachable on workers.dev at /s/<slug>/.
# routes = [{ pattern = "*.profilepush.site/*", zone_name = "profilepush.site" }]

[vars]
SUPABASE_URL = "https://nhwqcqzvotgdngtxulwi.supabase.co"
APP_BASE_URL = "https://profilepush.ai"
# The wildcard domain for sites, e.g. "profilepush.site" -> cerfits-x7k2.profilepush.site.
# Empty until that zone is set up.
SITES_DOMAIN = ""
# Seconds a site lookup is cached at the edge. Publishing a change shows
# within this window.
SITE_CACHE_SECONDS = "60"

# Secrets (wrangler secret put):
#   SUPABASE_SERVICE_ROLE_KEY  reads sites, writes submissions and résumés
#   WORKER_AUTH_TOKEN          the email worker's /send token, for enquiry alerts

# Enquiry alert emails go through the existing email worker (SES, user lane).
[[services]]
binding = "EMAIL_WORKER"
service = "profilepush-email-notifications"

# Per-visitor cap on form posts, so one script can't flood a site's inbox.
[[ratelimits]]
name = "SUBMIT_LIMITER"
namespace_id = "41001"
simple = { limit = 5, period = 60 }
