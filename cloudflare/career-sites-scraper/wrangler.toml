name = "profilepush-career-sites-scraper"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Hourly incremental run; the 06:05 UTC run also does a complete listing so
# jobs removed from a site are closed.
[triggers]
crons = ["5 * * * *"]

[vars]
SUPABASE_URL = "https://nhwqcqzvotgdngtxulwi.supabase.co"
# Comma-separated adapter slugs to run.
ENABLED_PRIMES = "teksystems,judge,apex,kforce,randstad,insightglobal,pyramid,diverselynx,mindlance"
FULL_SYNC_HOUR_UTC = "6"
# New listings fetched/parsed per prime per run (spreads the first backfill).
MAX_NEW_PER_RUN = "60"

# Secrets (wrangler secret put):
#   CAREER_SITES_SECRET  same value as the Supabase function secret
#   RUN_TOKEN              bearer token for manual runs via POST /run

# One message per prime so each prime runs in its own invocation.
[[queues.producers]]
binding = "SCRAPE_QUEUE"
queue = "career-sites-scrape"

[[queues.consumers]]
queue = "career-sites-scrape"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 2
