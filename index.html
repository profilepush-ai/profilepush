<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://nhwqcqzvotgdngtxulwi.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://nhwqcqzvotgdngtxulwi.supabase.co" />
    <!-- Inter for the marketing pages, loaded without blocking first render. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" /></noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />

    <!-- iOS "Add to Home Screen": launch standalone (no Safari chrome),
         correct icon, and a short title under the home-screen icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ProfilePush" />
    <!-- Android/Chrome equivalent of apple-mobile-web-app-capable -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Primary SEO -->
    <!-- What crawlers and link previews see before JS runs; mirrors the
         homepage's <SEO> (src/pages/LandingNew.tsx). Keep the two in step. -->
    <title>ProfilePush: AI Copilot for Job Hunting, Job Posting and Bench Sales</title>
    <meta name="description" content="AI job matches every day for IT job seekers, bench sales recruiters and job posters. Send your resume in one tap, track every application. 100 free matches." />
    <meta name="keywords" content="AI job search, AI job matching, AI copilot for job hunting, IT jobs, C2C jobs, contract jobs, H1B jobs, remote IT jobs, bench sales, bench sales recruiter software, job posting, hotlist, send resume, job application tracker, auto apply Chrome extension, US IT staffing app" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="author" content="ProfilePush" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="ProfilePush" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://profilepush.ai/" />
    <meta property="og:title" content="ProfilePush: AI Copilot for Job Hunting, Job Posting and Bench Sales" />
    <meta property="og:description" content="Live AI job matches for your profile, your consultants or your jobs, with the score, the skills that fit and an AI picture. Send the resume in one tap from your own Gmail. 100 free matches, then pay per match. Web and Android." />
    <meta property="og:image" content="https://profilepush.ai/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ProfilePush: AI Copilot for job hunting, job posting and bench sales." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@profilepush" />
    <meta name="twitter:title" content="ProfilePush: AI Copilot for Job Hunting, Job Posting and Bench Sales" />
    <meta name="twitter:description" content="Live AI job matches for your profile, your consultants or your jobs, with the score, the skills that fit and an AI picture. Send the resume in one tap from your own Gmail. 100 free matches, then pay per match. Web and Android." />
    <meta name="twitter:image:alt" content="ProfilePush: AI Copilot for job hunting, job posting and bench sales." />
    <meta name="twitter:image" content="https://profilepush.ai/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://profilepush.ai/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://profilepush.ai/#organization",
      "name": "ProfilePush",
      "url": "https://profilepush.ai",
      "logo": "https://profilepush.ai/logo.png",
      "description": "ProfilePush makes the AI Copilot for job hunting, job posting and bench sales in US IT staffing. IT job seekers and bench sales recruiters get live AI job matches for their profiles; job posters get matching profiles. Resumes go by AI-written email from the user's own Gmail in one tap. Available on the web, on Android and as a Chrome extension.",
      "email": "poorna@profilepush.ai",
      "areaServed": ["US", "IN"],
      "sameAs": [
        "https://www.linkedin.com/company/profile-push/",
        "https://www.facebook.com/profilepushh"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "poorna@profilepush.ai",
        "contactType": "customer support",
        "availableLanguage": "English"
      }
    }
    </script>

    <!-- JSON-LD: SoftwareApplication. One entity for the web app and the
         Android app (com.profilepush.app). Prices are the real ones:
         supabase/functions/_shared/credit-tiers.ts (1 credit = 1 match,
         ₹0.25 or $0.01; top-ups from ₹100 or $5), 100 signup credits. No
         aggregateRating: only with real ratings. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "@id": "https://profilepush.ai/#software",
      "name": "ProfilePush",
      "alternateName": ["ProfilePush AI Copilot", "ProfilePush: AI Job Search"],
      "url": "https://profilepush.ai/",
      "applicationCategory": "BusinessApplication",
      "applicationSubCategory": "Job search, recruiting and IT staffing",
      "operatingSystem": "Web, Android, Chrome",
      "downloadUrl": "https://play.google.com/store/apps/details?id=com.profilepush.app",
      "installUrl": "https://play.google.com/store/apps/details?id=com.profilepush.app",
      "image": "https://profilepush.ai/og-image.png",
      "description": "AI Copilot for job hunting, job posting and bench sales. Live AI job matches for a profile, a bench of consultants or a job post, each with a match score, the skills that fit and an AI picture; the resume goes by an AI-written email from the user's own Gmail in one tap, and every application is tracked in one sheet.",
      "featureList": [
        "Today: the day's AI matches as a swipeable reel, newest first; each stays 24 hours",
        "Match score, matching skills, visa, rate and location for every match, with an AI picture of the role",
        "Send resume: pick or upload a resume and AI writes the email to the poster, sent from your own Gmail",
        "Ask the poster for a missing rate, visa or location in one tap",
        "Ask Resume for job posters: request a matched profile's resume, rate and availability",
        "Tracker: every application in one sheet with status and notes; copy to Google Sheets or download CSV",
        "History of viewed, saved, applied and shared matches",
        "AI Match: paste a profile or a job for ranked matches on demand",
        "ProfilePush Apply Chrome extension: fills career-site application forms for your profile",
        "Your own avatar in the match pictures",
        "Match alerts by push and email; refer a friend for 100 credits"
      ],
      "offers": [
        {
          "@type": "Offer",
          "name": "Free start",
          "price": "0",
          "priceCurrency": "INR",
          "description": "100 free matches at signup. Viewing jobs, sending resumes, the tracker and history are free."
        },
        {
          "@type": "Offer",
          "name": "Pay per match (India)",
          "price": "0.25",
          "priceCurrency": "INR",
          "description": "₹0.25 a match, in one-time top-ups from ₹100 (₹250 buys 1,000 matches). No subscription; credits never expire."
        },
        {
          "@type": "Offer",
          "name": "Pay per match (outside India)",
          "price": "0.01",
          "priceCurrency": "USD",
          "description": "$0.01 a match, in one-time top-ups from $5 (500 matches). No subscription; credits never expire."
        }
      ],
      "publisher": { "@id": "https://profilepush.ai/#organization" }
    }
    </script>

    <!-- JSON-LD: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://profilepush.ai/#website",
      "url": "https://profilepush.ai",
      "name": "ProfilePush",
      "description": "AI Copilot for job hunting, job posting and bench sales: live AI job matches, one-tap resume sending and an application tracker.",
      "inLanguage": "en-US",
      "publisher": { "@id": "https://profilepush.ai/#organization" }
    }
    </script>
