    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://nhwqcqzvotgdngtxulwi.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://nhwqcqzvotgdngtxulwi.supabase.co" />
    <!-- Inter for the marketing pages, loaded without blocking first render. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />

    <!-- iOS "Add to Home Screen": launch standalone (no Safari chrome),
         correct icon, and a short title under the home-screen icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ProfilePush" />
    <!-- Android/Chrome equivalent of apple-mobile-web-app-capable -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Primary SEO -->
    <!-- What crawlers and link previews see before JS runs; mirrors the
         homepage's <SEO> (src/pages/LandingPage.tsx). Keep the two in step. -->
    <title>ProfilePush — AI Copilot for US IT Staffing</title>
    <meta name="description" content="AI Copilot for US IT staffing. Vendors get matching bench consultants; bench sales get matching C2C requirements, live all day. Free to start. On Android." />
    <meta name="keywords" content="AI copilot for US IT staffing, C2C requirements, bench sales recruiter software, hotlist consultants, IT staffing vendor software, bench consultants, AI matching for consultants and requirements, live staffing tracker, AI resume request, AI submission email, C2C W2 contract staffing, US IT staffing app" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="author" content="ProfilePush" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="ProfilePush" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://profilepush.ai/" />
    <meta property="og:title" content="ProfilePush — AI Copilot for US IT Staffing" />
    <meta property="og:description" content="Vendors get matching bench consultants. Bench sales get matching C2C requirements for every consultant. Live all day, emails sent from your own Gmail. Free to start, on web and Android." />
    <meta property="og:image" content="https://profilepush.ai/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ProfilePush: AI Copilot for US IT Staffing. Vendors, bench sales, live market." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@profilepush" />
    <meta name="twitter:title" content="ProfilePush — AI Copilot for US IT Staffing" />
    <meta name="twitter:description" content="Vendors get matching bench consultants. Bench sales get matching C2C requirements for every consultant. Live all day, emails sent from your own Gmail. Free to start, on web and Android." />
    <meta name="twitter:image:alt" content="ProfilePush: AI Copilot for US IT Staffing. Vendors, bench sales, live market." />
    <meta name="twitter:image" content="https://profilepush.ai/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://profilepush.ai/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://profilepush.ai/#organization",
      "name": "ProfilePush",
      "url": "https://profilepush.ai",
      "logo": "https://profilepush.ai/logo.png",
      "description": "ProfilePush makes the AI Copilot for US IT staffing. Vendors post requirements and get matching bench consultants; bench sales recruiters paste a hotlist and get matching C2C requirements for every consultant. Matches land in a live Tracker, and AI-written emails send from the user's own Gmail. Available on the web and on Android.",
      "email": "poorna@profilepush.ai",
      "areaServed": ["US", "IN"],
      "sameAs": [
        "https://www.linkedin.com/company/profile-push/",
        "https://www.facebook.com/profilepushh"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "poorna@profilepush.ai",
        "contactType": "customer support",
        "availableLanguage": "English"
      }
    }
    </script>

    <!-- JSON-LD: SoftwareApplication. One entity for the web app and the
         Android app (com.profilepush.app). Prices are the real ones:
         supabase/functions/_shared/credit-tiers.ts, 100 signup credits per
         the accounts trigger. No aggregateRating here: RatingBlock adds it
         on this same @id only when there are 10+ real user ratings. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "@id": "https://profilepush.ai/#software",
      "name": "ProfilePush",
      "alternateName": "ProfilePush AI Copilot",
      "url": "https://profilepush.ai/",
      "applicationCategory": "BusinessApplication",
      "applicationSubCategory": "Staffing and recruiting",
      "operatingSystem": "Web, Android",
      "downloadUrl": "https://play.google.com/store/apps/details?id=com.profilepush.app",
      "installUrl": "https://play.google.com/store/apps/details?id=com.profilepush.app",
      "image": "https://profilepush.ai/og-image.png",
      "screenshot": [
        "https://profilepush.ai/screens/vendors.jpg",
        "https://profilepush.ai/screens/bench-sales.jpg"
      ],
      "description": "The AI Copilot for US IT staffing. Vendors post a requirement and matching bench consultants land in a live Tracker; bench sales recruiters paste a hotlist and every consultant gets a live column of matching C2C requirements. AI Request and AI Submit write the email, sent from the user's own Gmail.",
      "featureList": [
        "Tracker: a live column for each posted consultant or requirement, with new matches arriving all day",
        "AI Match: paste a consultant or a requirement and get ranked matches with fit and skill gaps",
        "AI Request: one tap asks a bench recruiter for a consultant's resume, rate, visa and availability (draft free)",
        "AI Submit: an AI-written submission email with the resume attached, sent from your own Gmail",
        "Hotlist paste: post a whole bench, up to 50 consultants, in one paste",
        "Inbound resume requests in one list, replies free",
        "Match alerts on Android, web push and email",
        "Optional AI video screening with a recording, a score and a summary",
        "Team accounts with unlimited members"
      ],
      "offers": [
        {
          "@type": "Offer",
          "name": "Free",
          "price": "0",
          "priceCurrency": "INR",
          "description": "Free to start: 100 credits at signup that never expire. Posting and submissions are free; up to 3 open consultants or requirements on the free plan."
        },
        {
          "@type": "AggregateOffer",
          "name": "Credit packs",
          "lowPrice": "249",
          "highPrice": "5000",
          "priceCurrency": "INR",
          "description": "One-time credit packs from ₹249 to ₹5,000 at ₹1 per credit. Credits never expire. No subscription."
        }
      ],
      "publisher": { "@id": "https://profilepush.ai/#organization" }
    }
    </script>

    <!-- JSON-LD: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://profilepush.ai/#website",
      "url": "https://profilepush.ai",
      "name": "ProfilePush",
      "description": "AI Copilot for US IT Staffing: vendors and bench sales recruiters, matched on the live market.",
      "inLanguage": "en-US",
      "publisher": { "@id": "https://profilepush.ai/#organization" }
    }
    </script>
